name: Release

# A tag vX.Y.Z on main builds both products, core and app, for every
# platform; verifies the release; installs, verifies and uninstalls it on each
# platform with the release's own installers; runs the end-to-end test
# (scripts/uat.py) on it; attests the build provenance of every file; and
# stages them all on a draft release, which the operator publishes. Run by
# hand (workflow_dispatch), it is a dry run of the same build and checks:
# nothing is attested or released, and the files stay a workflow artifact for
# seven days.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build every product for every platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # main and the tags, to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the release identity
        id: identity
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "The tag $GITHUB_REF_NAME does not name package.json's version, $version" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "$GITHUB_REF_NAME is not on main; a release is tagged on main" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build core and app for every target
        run: python scripts/build-release.py --out "$RUNNER_TEMP/release"
      - name: Verify the release against its manifests, its tag and this commit
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: python scripts/verify-release.py --directory "$RUNNER_TEMP/release" --tag "v$VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # Each platform runs its own facet, facet-app and compa-kernel from the
  # archives, then installs, verifies and uninstalls the release with the
  # installer a person downloads from it.
  smoke:
    name: Smoke (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Verify the release and run this platform's products from it
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/verify-release.py --directory "$RUNNER_TEMP/release" --tag "v$VERSION" --commit "$GITHUB_SHA" --smoke
      - name: Install, add the App, verify and uninstall with the release's install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1 -Release "$env:RUNNER_TEMP\release" -Installer "$env:RUNNER_TEMP\release\install.ps1"
      - name: The same in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-installer.ps1 -Shell powershell -Release "$env:RUNNER_TEMP\release" -Installer "$env:RUNNER_TEMP\release\install.ps1"
      - name: Install, add the App, verify and uninstall with the release's install.sh
        if: runner.os != 'Windows'
        run: sh scripts/smoke-installer.sh --installer "$RUNNER_TEMP/release/install.sh" "$RUNNER_TEMP/release"

  # The end-to-end test (scripts/uat.py) on the release's own linux/amd64
  # files: installed into a clean Ubuntu container, wired into OpenCode, with
  # the default components; then, with no network, OpenCode loads the wiring
  # and facet renders and reviews a video. No release without a real render.
  uat:
    name: Install, wire and render in a clean Ubuntu
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Install, wire, render and review in a clean Ubuntu
        run: python scripts/uat.py --release "$RUNNER_TEMP/release" --evidence "$RUNNER_TEMP/uat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uat-evidence
          path: ${{ runner.temp }}/uat
          if-no-files-found: warn
          retention-days: 7

  draft:
    name: Draft the release
    if: github.event_name == 'push'
    needs: [build, smoke, uat]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # Build provenance attestations.
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Check every file against SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS
      # Check a downloaded file with: gh attestation verify FILE --repo kayiik/facet
      - name: Attest the build provenance of every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Stage the files on a draft release, and check each one there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matches=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]')
          if [ "$(printf '%s' "$matches" | jq '[.[] | select(.draft == false)] | length')" -ne 0 ]; then
            echo "$TAG is published already; a published release is never replaced" >&2
            exit 1
          fi
          case "$(printf '%s' "$matches" | jq length)" in
            0)
              release_id=$(gh api --method POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Facet $TAG" \
                -F draft=true -F generate_release_notes=true --jq .id) ;;
            1)
              # A draft an earlier run left for this tag: it gets exactly this build's files.
              release_id=$(printf '%s' "$matches" | jq -r '.[0].id')
              for asset in $(gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" --jq '.[].id'); do
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset"
              done ;;
            *)
              echo "More than one draft release names $TAG; delete the extra drafts and run this again" >&2
              exit 1 ;;
          esac
          gh release upload "$TAG" release/*
          (cd release && sha256sum -- *) | sort -k2 > local.sums
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[] | "\(.digest // "none" | sub("^sha256:"; ""))  \(.name)"' | sort -k2 > remote.sums
          diff -u local.sums remote.sums
          echo "Drafted Facet $TAG with $(wc -l < remote.sums) files; publish it at https://github.com/$GH_REPO/releases"
