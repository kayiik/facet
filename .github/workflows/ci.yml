name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency downloads are allowed. These gates use local fixtures, not Docker,
# agent/model inference, live media providers, release certification or publishing.
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            remotion-composer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg installation did not provide its executable.' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Verify FFprobe
        run: ffprobe -version
      - name: Install root dependencies (lockfile must match package.json)
        run: npm ci --no-audit --no-fund
      - name: Install composer dependencies
        working-directory: remotion-composer
        run: npm ci --no-audit --no-fund
      - name: Go short suite (no live providers)
        run: go test -short ./... -count=1 -timeout=6m
      - name: Go vet
        run: go vet ./...
      - name: Launcher and UAT unit tests (no Docker, no model calls)
        run: node --test "bin/*.test.js" "scripts/*.test.mjs"
      - name: Composer typecheck and build
        working-directory: remotion-composer
        run: node node_modules/typescript/bin/tsc
      - name: Composer tests (source allowlist, contract, render)
        working-directory: remotion-composer
        run: node --test "tests/*.test.mjs"
      - name: Third-party notices generator tests (current platform)
        run: python -m unittest discover -s scripts -p test_generate_notices.py -v
      - name: Third-party notices for every release target
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            python scripts/generate-notices.py --goos "${target%/*}" --goarch "${target#*/}" \
              --out "$RUNNER_TEMP/notices/facet-${target%/*}-${target#*/}.md"
          done
      - name: Installer syntax (bash)
        if: runner.os == 'Linux'
        run: bash -n install.sh
      - name: Windows installer parser and preflight
        shell: pwsh
        run: ./scripts/test-release-installer.ps1
      - name: npm content and version checks (not binary distribution)
        run: node scripts/release-package-smoke.mjs
