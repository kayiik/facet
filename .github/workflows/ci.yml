name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Compa release the App is tested with, checked against its SHA256SUMS
  # and its build provenance. The App's facet is built from the same commit.
  COMPA_VERSION: 0.0.1

# Dependency downloads are allowed. These gates use local fixtures, not Docker,
# agent/model inference, live media providers, release certification or publishing.
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            remotion-composer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg installation did not provide its executable.' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify FFmpeg
        run: ffmpeg -version
      - name: Verify FFprobe
        run: ffprobe -version
      - name: Install root dependencies (lockfile must match package.json)
        run: npm ci --no-audit --no-fund
      - name: Install composer dependencies
        working-directory: remotion-composer
        run: npm ci --no-audit --no-fund
      - name: Fetch the App's pinned Compa kernel (checksum and provenance verified)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Windows) os=windows ext=zip exe=.exe ;; Linux) os=linux ext=tar.gz exe= ;; esac
          asset="compa_${COMPA_VERSION}_${os}_amd64.${ext}"
          dir="$RUNNER_TEMP/compa"
          mkdir -p "$dir"
          gh release download "v$COMPA_VERSION" --repo kayiik/compa --pattern "$asset" --pattern SHA256SUMS --dir "$dir"
          (cd "$dir" && grep " $asset\$" SHA256SUMS | sha256sum -c -)
          gh attestation verify "$dir/$asset" --repo kayiik/compa
          if [ "$ext" = zip ]; then (cd "$dir" && unzip -q "$asset"); else tar -xzf "$dir/$asset" -C "$dir"; fi
          kernel=$(find "$dir" -name "compa-kernel$exe" -type f | head -n 1)
          test -n "$kernel"
          echo "FACET_APP_KERNEL=$kernel" >> "$GITHUB_ENV"
      - name: Build facet from this commit for the App's tests
        shell: bash
        run: |
          set -euo pipefail
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          out="$RUNNER_TEMP/facet/bin/facet$exe"
          CGO_ENABLED=0 go build -trimpath -o "$out" ./cmd/facet
          "$out" version
          echo "FACET_APP_FACET=$out" >> "$GITHUB_ENV"
      - name: Go short suite (no live providers; the App's tests drive the real kernel and facet)
        run: go test -short ./... -count=1 -timeout=6m
      - name: Go vet
        run: go vet ./...
      - name: Build the App
        run: go build -o "${{ runner.temp }}" ./cmd/facet-app
      - name: Launcher and UAT unit tests (no Docker, no model calls)
        run: node --test "bin/*.test.js" "scripts/*.test.mjs"
      - name: Composer typecheck and build
        working-directory: remotion-composer
        run: node node_modules/typescript/bin/tsc
      - name: Composer tests (source allowlist, contract, render)
        working-directory: remotion-composer
        run: node --test "tests/*.test.mjs"
      - name: Third-party notices generator tests (current platform)
        run: python -m unittest discover -s scripts -p test_generate_notices.py -v
      - name: Release contract tests
        run: python -m unittest discover -s scripts -p test_release_contract.py -v
      - name: Website staging tests
        run: python -m unittest discover -s scripts -p test_stage_site.py -v
      - name: npm content and version checks (not binary distribution)
        run: node scripts/release-package-smoke.mjs

  # Builds both products for all six targets on one runner, as the release
  # does (third-party notices included), and checks every archive against
  # manifest.tsv; then runs this runner's facet, facet-app and compa-kernel
  # from the archives.
  release-build:
    name: Release build (every target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core and app for every target
        run: python scripts/build-release.py --out "$RUNNER_TEMP/release"
      - name: Verify the release and run the native products
        run: python scripts/verify-release.py --directory "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --smoke

  # install.ps1 against two releases built here: install, add the App, verify,
  # upgrade and uninstall, PATH and Start menu included, run by PowerShell 7
  # and by Windows PowerShell 5.1, which a stock Windows opens.
  installer-windows:
    name: Installer (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build two releases for windows/amd64, this version and the next
        shell: pwsh
        run: |
          python scripts/build-release.py --out "$env:RUNNER_TEMP\release" --downloads "$env:RUNNER_TEMP\compa" --targets windows/amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $next = python scripts/next-version.py
          python scripts/build-release.py --out "$env:RUNNER_TEMP\next" --downloads "$env:RUNNER_TEMP\compa" --targets windows/amd64 --version $next
      - name: Install, add the App, verify, upgrade and uninstall (PowerShell 7)
        shell: pwsh
        run: ./scripts/smoke-installer.ps1 -Release "$env:RUNNER_TEMP\release" -Next "$env:RUNNER_TEMP\next"
      - name: The same in Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/smoke-installer.ps1 -Shell powershell -Release "$env:RUNNER_TEMP\release" -Next "$env:RUNNER_TEMP\next"

  # install.sh the same way, on Linux and macOS.
  installer-unix:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer syntax
        run: sh -n install.sh
      - name: Build two releases for this platform, this version and the next
        run: |
          target=$(python -c 'import platform; print({"Linux": "linux", "Darwin": "darwin"}[platform.system()] + "/" + {"x86_64": "amd64", "arm64": "arm64", "aarch64": "arm64"}[platform.machine()])')
          python scripts/build-release.py --out "$RUNNER_TEMP/release" --downloads "$RUNNER_TEMP/compa" --targets "$target"
          python scripts/build-release.py --out "$RUNNER_TEMP/next" --downloads "$RUNNER_TEMP/compa" --targets "$target" --version "$(python scripts/next-version.py)"
      - name: Install, add the App, verify, upgrade and uninstall
        run: sh scripts/smoke-installer.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/next"
