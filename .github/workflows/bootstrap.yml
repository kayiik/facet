name: Installer one-liners

on:
  push:
    branches: [staging, main]
    paths:
      - 'docs/install.ps1'
      - 'docs/install.sh'
      - 'scripts/test-bootstrap*'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    paths:
      - 'docs/install.ps1'
      - 'docs/install.sh'
      - 'scripts/test-bootstrap*'
      - '.github/workflows/bootstrap.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PowerShell pipe and failure checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1
      - name: Bash pipe and real terminal checks
        if: runner.os != 'Windows'
        run: |
          bash -n docs/install.sh
          python3 scripts/test-bootstrap.py
      - name: Verify pinned published installer and handoff
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/test-bootstrap-live.py
      # Post-release only: the pinned published release installs just the facet
      # runtime, with no optional components and no shell profile or PATH edits.
      - name: Published one-liner installs the facet runtime (no components, no PATH edits)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *version=\([0-9][0-9A-Za-z.-]*\)$/\1/p' docs/install.sh)
          test -n "$version"
          case "$version" in
            0.*|1.*) echo "The bootstrap pins $version, which predates the 2.0 installer flags; nothing to verify yet."; exit 0;;
          esac
          export HOME="$(mktemp -d "$RUNNER_TEMP/facet-home-XXXXXX")"
          cat docs/install.sh | sh -s -- --yes --components none --no-path
          facet="$HOME/.facet/current/bin/facet"
          test "$("$facet" version)" = "facet v$version"
          "$facet" doctor
          for profile in .profile .bashrc .bash_profile .zshrc .zprofile .config/fish/config.fish; do
            if [ -e "$HOME/$profile" ]; then echo "--no-path wrote $profile" >&2; exit 1; fi
          done
