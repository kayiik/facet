id: clean-professional

identity:
  name: Clean Professional
  category: motion-graphics
  mood: polished, trustworthy, clear
  pace: moderate
  best_for: Corporate explainers, educational content, SaaS demos, conference talks

visual_language:
  color_palette:
    primary: ["#2563EB", "#1E40AF"]
    accent: ["#F59E0B", "#10B981"]
    background: "#FFFFFF"
    surface: "#F9FAFB"
    text: "#1F2937"
    muted: "#6B7280"
  composition: centred, generous whitespace, rule of thirds for key visuals
  texture: clean and flat, no grain, no noise

typography:
  headings:
    font: Inter
    weight: 700
    tracking: "-0.02em"
  body:
    font: Inter
    weight: 400
    line_height: 1.6
  code:
    font: JetBrains Mono
    weight: 400
  stat_card:
    font: Inter
    weight: 800
    size_multiplier: 3.0
  scale_system: major_third
  weight_matrix:
    title: 800
    heading: 700
    body: 400
    caption: 400

motion:
  transitions: [cut, fade, slide]
  camera_moves: [static, zoom-in, ken-burns]
  animation_style: ease-in-out, clean, no bounce
  spring:
    damping: 22
    stiffness: 120
    mass: 1
  pacing_rules:
    min_scene_hold_seconds: 2.5
    max_scene_hold_seconds: 12
    text_card_hold_seconds: 3.5
    stat_card_hold_seconds: 3.0
    transition_duration_seconds: 0.4
  entrance: fade up with a slight scale (0.95 to 1.0)
  exit: fade out

audio:
  voice_style: professional, clear, moderate pace, warm but authoritative
  music_mood: ambient corporate, upbeat but not distracting
  music_volume: 0.08
  sfx_style: subtle clicks, soft whooshes on transitions

asset_generation:
  image_prompt_prefix: "clean flat illustration, light background, restrained corporate palette, soft shadows, "
  image_negative_prompt: photorealistic, 3d render, dark, grungy, cluttered, low quality
  diagram_style: clean lines, rounded nodes, subtle shadows
  consistency_anchors:
    - "Blue (#2563EB) as the primary accent in every illustration"
    - White or light grey backgrounds throughout
    - Flat illustration, no 3D or photorealism
    - "Soft, even lighting, no dramatic shadows"

overlays:
  stat_card:
    bg: "#F3F4F6"
    border: "#2563EB"
    radius: 8
    shadow: "0 2px 8px rgba(0,0,0,0.08)"
  key_term:
    bg: "#EFF6FF"
    text: "#1E40AF"
    radius: 4
  code_block:
    bg: "#1F2937"
    text: "#E5E7EB"
    highlight: "#F59E0B"
  captions:
    bg: "rgba(255, 255, 255, 0.85)"
    text: "#1F2937"
    highlight: "#2563EB"

quality_rules:
  - Contrast at least 4.5:1 for all text
  - No more than 3 colours on screen at once, not counting the background
  - Text readable at 720p
  - Every generated image uses the blue, white and grey palette
  - Hold establishing shots at least 2.5 s
  - No rapid cutting; at least 2 s between transitions

chart_palette:
  - "#2563EB"
  - "#F59E0B"
  - "#10B981"
  - "#8B5CF6"
  - "#EF4444"
  - "#06B6D4"

color_rules:
  harmony_type: analogous
  contrast_validation: true
  colorblind_safe: true
